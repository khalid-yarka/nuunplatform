<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetting app… — NuunPlatform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background: #F9FAFB; color: #111827;
            text-align: center; padding: 20px;
        }
        .box { max-width: 420px; }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { color: #6B7280; line-height: 1.6; margin: 0 0 24px; }
        .spinner {
            width: 44px; height: 44px; margin: 0 auto 20px;
            border: 4px solid #E5E7EB; border-top-color: #FF3138;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { font-size: 13px; color: #9CA3AF; min-height: 20px; }
        a.btn {
            display: inline-block; margin-top: 16px; padding: 12px 24px;
            background: #FF3138; color: #fff; border-radius: 10px;
            text-decoration: none; font-weight: 600;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="spinner" id="spinner"></div>
    <h1>Refreshing your app</h1>
    <p>We're clearing the old cached version and loading the latest one.</p>
    <div class="status" id="status">Starting…</div>
    <a href="/home" class="btn" id="continueBtn" style="display:none;">Continue</a>
</div>
<script>
(async function () {
    var status = document.getElementById('status');
    try {
        if ('serviceWorker' in navigator) {
            status.textContent = 'Unregistering service worker…';
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
                await regs[i].unregister();
            }
        }
        if (window.caches) {
            status.textContent = 'Clearing caches…';
            var keys = await caches.keys();
            for (var j = 0; j < keys.length; j++) {
                await caches.delete(keys[j]);
            }
        }
        try {
            localStorage.removeItem('preferred-theme');
            localStorage.removeItem('preferred-accent');
            sessionStorage.clear();
        } catch (e) { /* ignore */ }
        status.textContent = 'Done. Reloading…';
        setTimeout(function () {
            window.location.replace('/home');
        }, 600);
    } catch (err) {
        status.textContent = 'Could not fully reset — please close all tabs and reopen.';
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('continueBtn').style.display = 'inline-block';
    }
})();
</script>
</body>
</html>
