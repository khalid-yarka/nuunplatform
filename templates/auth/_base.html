<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Account - NuunPlatform{% endblock %}</title>

    <!-- ANTI-FLASH: apply theme before first paint -->
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('preferred-theme');
                // 'system' or absent → resolve from OS; otherwise use saved value
                var resolved;
                if (!saved || saved === 'system') {
                    resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                } else {
                    resolved = saved;
                }
                document.documentElement.setAttribute('data-theme', resolved);

                var accent = localStorage.getItem('preferred-accent') || 'red';
                var ACCENTS = {
                    red:    { hex: '#FF3138', hover: '#E62B32', light: '#FFEBE8', light_dark: '#3A1A20' },
                    blue:   { hex: '#3B82F6', hover: '#2563EB', light: '#E8F0FE', light_dark: '#1A2A4A' },
                    green:  { hex: '#10B981', hover: '#059669', light: '#D1FAE5', light_dark: '#1A3A2E' },
                    purple: { hex: '#8B5CF6', hover: '#7C3AED', light: '#EDE9FE', light_dark: '#2A1A4A' },
                    orange: { hex: '#F59E0B', hover: '#D97706', light: '#FEF3C7', light_dark: '#3A2E1A' }
                };
                var a = ACCENTS[accent] || ACCENTS.red;
                var isDark = resolved === 'dark';
                var root = document.documentElement;
                root.style.setProperty('--primary', a.hex);
                root.style.setProperty('--primary-hover', a.hover);
                root.style.setProperty('--primary-light', isDark ? a.light_dark : a.light);

                var fontSize = localStorage.getItem('preferred-font-size') || 'medium';
                var sizes = { small: '14px', medium: '16px', large: '18px' };
                root.style.setProperty('--base-font-size', sizes[fontSize] || '16px');
            } catch (e) { /* silent */ }
        })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}" />

    {% block extra_css %}{% endblock %}
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" />
            </div>

            {% block auth_body %}{% endblock %}

        </div>
    </div>

    <!-- ============================================ -->
    <!-- FLOATING THEME TOGGLE (simple on/off)        -->
    <!-- ============================================ -->
    <button type="button"
            class="auth-theme-toggle"
            id="authThemeToggle"
            aria-label="Toggle theme">
        <i class="fas fa-moon" id="authThemeIcon" aria-hidden="true"></i>
    </button>

    <style>
        .auth-theme-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10000;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s ease, box-shadow 0.2s ease,
                        background 0.2s ease, color 0.2s ease;
        }
        .auth-theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.20);
            background: var(--primary-light);
            color: var(--primary);
        }
        .auth-theme-toggle:active {
            transform: translateY(0) scale(0.96);
        }
        @media (max-width: 480px) {
            .auth-theme-toggle {
                bottom: 16px;
                right: 16px;
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }
    </style>

    <script>
        (function () {
            var btn  = document.getElementById('authThemeToggle');
            var icon = document.getElementById('authThemeIcon');
            if (!btn || !icon) return;

            function currentResolved() {
                var saved = localStorage.getItem('preferred-theme');
                if (!saved || saved === 'system') {
                    return window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark' : 'light';
                }
                return saved;
            }

            function syncIcon() {
                icon.className = currentResolved() === 'dark'
                    ? 'fas fa-sun'
                    : 'fas fa-moon';
            }

            function applyAccentTint(resolved) {
                try {
                    var accent = localStorage.getItem('preferred-accent') || 'red';
                    var ACCENTS = {
                        red:    { hex: '#FF3138', hover: '#E62B32', light: '#FFEBE8', light_dark: '#3A1A20' },
                        blue:   { hex: '#3B82F6', hover: '#2563EB', light: '#E8F0FE', light_dark: '#1A2A4A' },
                        green:  { hex: '#10B981', hover: '#059669', light: '#D1FAE5', light_dark: '#1A3A2E' },
                        purple: { hex: '#8B5CF6', hover: '#7C3AED', light: '#EDE9FE', light_dark: '#2A1A4A' },
                        orange: { hex: '#F59E0B', hover: '#D97706', light: '#FEF3C7', light_dark: '#3A2E1A' }
                    };
                    var a = ACCENTS[accent] || ACCENTS.red;
                    var root = document.documentElement;
                    root.style.setProperty('--primary', a.hex);
                    root.style.setProperty('--primary-hover', a.hover);
                    root.style.setProperty('--primary-light', resolved === 'dark' ? a.light_dark : a.light);
                } catch (e) { /* silent */ }
            }

            syncIcon();

            btn.addEventListener('click', function () {
                var next = currentResolved() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('preferred-theme', next);
                applyAccentTint(next);
                syncIcon();
            });

            // If OS theme changes and the user hasn't pinned a preference,
            // keep the icon in sync.
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
                var saved = localStorage.getItem('preferred-theme');
                if (!saved || saved === 'system') {
                    var resolved = currentResolved();
                    document.documentElement.setAttribute('data-theme', resolved);
                    applyAccentTint(resolved);
                    syncIcon();
                }
            });
        })();
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
